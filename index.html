<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>I.E. Emblemática José María Arguedas — Aventura Escolar Isométrica 64-Bit</title>
  <style>
    /* ==========================================================================
       ESTILOS RETRO 64-BIT ISOMÉTRICO — PALETA TIERRA & PIZARRA UNIFICADA
       ========================================================================== */
    :root {
      --bg-slate: #263635;
      --floor-sand: #C7BCA1;
      --floor-taupe: #8A7F6A;
      --wood-ochre: #9F6E46;
      --wood-dark: #78563A;
      --accent-mustard: #D9B656;
      --accent-sage: #617B56;
      --accent-terracotta: #A65A4E;
      --accent-blue: #4B6374;
      --outline-dark: #3A2F26;
      --detail-bone: #DEDBD0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #263635;
      color: #DEDBD0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra HUD Superior estilo RPG 64-bit */
    .hud-bar {
      width: 100%;
      background: #263635;
      border-bottom: 3px solid #3A2F26;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(58, 47, 38, 0.55);
    }

    .hud-bar.is-hidden {
      display: none;
    }

    .hud-school {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .peru-badge {
      display: inline-flex;
      width: 24px;
      height: 16px;
      border: 2px solid #DEDBD0;
      flex-shrink: 0;
      background: linear-gradient(
        to right,
        #A65A4E 0%, #A65A4E 33.3%,
        #DEDBD0 33.3%, #DEDBD0 66.6%,
        #A65A4E 66.6%, #A65A4E 100%
      );
    }

    .school-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #DEDBD0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 2px 2px 0 #3A2F26;
    }

    /* Indicador persistente de Escenario y Piso */
    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #263635;
      border: 2px solid #D9B656;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 900;
      color: #D9B656;
      text-shadow: 1px 1px 0 #3A2F26;
      white-space: nowrap;
    }

    .location-pill.floor-2 {
      border-color: #617B56;
      background: #3A2F26;
      color: #DEDBD0;
    }

    .hud-controls-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #C7BCA1;
      white-space: nowrap;
    }

    .kbd-tag {
      background: #4B6374;
      border: 1px solid #3A2F26;
      border-bottom-width: 2px;
      color: #DEDBD0;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 10px;
    }

    .btn-hud {
      background: #4B6374;
      border: 2px solid #8A7F6A;
      color: #DEDBD0;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn-hud:hover {
      background: #617B56;
      border-color: #D9B656;
      color: #DEDBD0;
    }

    .btn-hud:active {
      transform: translateY(1px);
    }

    /* Contenedor central del Canvas Isométrico Pixel-Art */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      position: relative;
      overflow: hidden;
      background: #263635;
    }

    .canvas-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #8A7F6A;
      box-shadow:
        0 0 0 3px #3A2F26,
        0 18px 42px rgba(58, 47, 38, 0.75);
      border-radius: 4px;
      background: #263635;
      max-width: 100%;
      max-height: 100%;
    }

    canvas#gameCanvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
    }

    /* Barra inferior compacta para controles táctiles / mouse */
    .touch-controls {
      width: 100%;
      background: #263635;
      border-top: 3px solid #3A2F26;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .touch-controls.is-hidden {
      display: none;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(2, 32px);
      gap: 4px;
    }

    .pad-btn {
      background: #4B6374;
      border: 2px solid #8A7F6A;
      border-bottom-width: 4px;
      border-radius: 6px;
      color: #DEDBD0;
      font-family: inherit;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .pad-btn:active, .pad-btn.is-pressed {
      background: #9F6E46;
      border-color: #D9B656;
      border-bottom-width: 2px;
      transform: translateY(2px);
    }

    .action-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-mini {
      display: none;
      font-size: 11px;
      color: #C7BCA1;
      line-height: 1.35;
    }

    @media (min-width: 768px) {
      .legend-mini {
        display: block;
      }
      .dpad-grid {
        grid-template-columns: repeat(3, 34px);
        grid-template-rows: repeat(2, 28px);
      }
    }

    @media (max-width: 640px) {
      .hud-controls-info {
        display: none;
      }
      .school-title {
        font-size: 11px;
      }
      .location-pill {
        font-size: 10px;
        padding: 3px 7px;
      }
    }

    .btn-action-e {
      background: #A65A4E;
      border: 2px solid #DEDBD0;
      border-bottom-width: 4px;
      color: #DEDBD0;
      font-family: inherit;
      font-weight: 900;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #3A2F26;
      touch-action: manipulation;
    }

    .btn-action-e:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-action-f {
      background: #4B6374;
      border: 2px solid #D9B656;
      border-bottom-width: 4px;
      color: #DEDBD0;
      font-family: inherit;
      font-weight: 900;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-action-f:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       HUD SUPERIOR PERSISTENTE (VISIBLE DURANTE LA EXPLORACIÓN DEL COLEGIO)
       ======================================================================== -->
  <header id="hudBar" class="hud-bar is-hidden">
    <div class="hud-school">
      <span class="peru-badge" aria-hidden="true"></span>
      <span class="school-title">I.E. JOSÉ MARÍA ARGUEDAS</span>
    </div>

    <!-- Indicador dinámico de Escenario y Piso -->
    <div id="hudLocation" class="location-pill">
      <span>📍 PATIO PRINCIPAL · CAMPUS</span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;">
      <div class="hud-controls-info">
        <span><span class="kbd-tag">↑↓←→</span> Mover</span>
        <span><span class="kbd-tag">E</span> Hablar · <span class="kbd-tag">F</span> Objetos</span>
        <span><span class="kbd-tag">R</span> Reparar pared</span>
      </div>
      <button id="btnAudio" class="btn-hud" type="button" title="Activar/Silenciar música y efectos">
        🔊 AUDIO: ON
      </button>
      <button id="btnCampusReset" class="btn-hud" type="button" title="Volver al Patio Principal">
        🏫 Patio
      </button>
      <button id="btnOpenMenu" class="btn-hud" type="button" title="Volver al Menú Principal o Cambiar Personaje">
        👤 Menú
      </button>
    </div>
  </header>

  <!-- ========================================================================
       ESCENARIO PRINCIPAL DEL VIDEOJUEGO ISOMÉTRICO 64-BIT (960 x 640)
       ======================================================================== -->
  <main class="stage-wrapper" id="stageWrapper">
    <div class="canvas-frame" id="canvasFrame">
      <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>
  </main>

  <!-- ========================================================================
       CONTROLES TÁCTILES / MOUSE COMPACTOS (D-PAD + BOTÓN [E])
       ======================================================================== -->
  <footer id="touchControls" class="touch-controls is-hidden">
    <div class="dpad-grid" aria-label="Cruceta de movimiento isométrico">
      <div></div>
      <button class="pad-btn" data-dir="up" type="button" aria-label="Arriba">▲</button>
      <div></div>
      <button class="pad-btn" data-dir="left" type="button" aria-label="Izquierda">◀</button>
      <button class="pad-btn" data-dir="down" type="button" aria-label="Abajo">▼</button>
      <button class="pad-btn" data-dir="right" type="button" aria-label="Derecha">▶</button>
    </div>

    <div class="legend-mini">
      <div><strong style="color:#D9B656;">EXPLORA TODO EL COLEGIO (64-BIT ISOMÉTRICO):</strong> Usa las flechas para caminar; pulsa <strong style="color:#DEDBD0;">[E]</strong> para hablar, <strong style="color:#DEDBD0;">[F]</strong> para recoger y usar objetos, y <strong style="color:#DEDBD0;">[R]</strong> para reparar grietas con la espátula.</div>
    </div>

    <div class="action-cluster">
      <button id="btnTouchInteract" class="btn-action-e" type="button">
        [E] INTERACTUAR
      </button>
      <button id="btnTouchItem" class="btn-action-f" type="button">
        [F] USAR ÍTEM
      </button>
    </div>
  </footer>

  <!-- ========================================================================
       MOTOR DEL VIDEOJUEGO ISOMÉTRICO PIXEL-ART 64-BIT (VANILLA JS + HTML5 CANVAS)
       ======================================================================== -->
  <script>
    (function () {
      'use strict';

      // ======================================================================
      // 1. CONFIGURACIÓN DEL CANVAS Y ESCALADO RESPONSIVO PIXEL-PERFECT
      // ======================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const stageWrapper = document.getElementById('stageWrapper');
      const hudBar = document.getElementById('hudBar');
      const touchControls = document.getElementById('touchControls');
      const hudLocation = document.getElementById('hudLocation');
      const btnAudio = document.getElementById('btnAudio');
      const btnCampusReset = document.getElementById('btnCampusReset');
      const btnOpenMenu = document.getElementById('btnOpenMenu');

      ctx.imageSmoothingEnabled = false;

      const LOGICAL_W = 960;
      const LOGICAL_H = 640;

      function resizeCanvas() {
        const rect = stageWrapper.getBoundingClientRect();
        const availW = Math.max(300, rect.width - 12);
        const availH = Math.max(200, rect.height - 12);
        const scale = Math.min(availW / LOGICAL_W, availH / LOGICAL_H);
        canvas.style.width = `${Math.floor(LOGICAL_W * scale)}px`;
        canvas.style.height = `${Math.floor(LOGICAL_H * scale)}px`;
      }
      window.addEventListener('resize', resizeCanvas);

      // ======================================================================
      // 2. SINTETIZADOR DE EFECTOS Y MÚSICA EN BUCLE INFINITO (WEB AUDIO API)
      // ======================================================================
      let audioCtx = null;
      let soundEnabled = true;

      function ensureAudio() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playTone(freq, duration, type = 'square', gainVal = 0.055, delay = 0) {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      const SFX = {
        uiSelect() {
          playTone(587, 0.06, 'square', 0.05, 0);
          playTone(880, 0.09, 'square', 0.05, 0.05);
        },
        uiConfirm() {
          playTone(523, 0.07, 'square', 0.06, 0);
          playTone(659, 0.07, 'square', 0.06, 0.06);
          playTone(784, 0.14, 'square', 0.06, 0.12);
        },
        door() {
          playTone(330, 0.08, 'square', 0.05, 0);
          playTone(494, 0.12, 'square', 0.05, 0.07);
        },
        stairsUp() {
          playTone(392, 0.07, 'triangle', 0.08, 0);
          playTone(494, 0.07, 'triangle', 0.08, 0.06);
          playTone(587, 0.07, 'triangle', 0.08, 0.12);
          playTone(784, 0.14, 'triangle', 0.08, 0.18);
        },
        stairsDown() {
          playTone(784, 0.07, 'triangle', 0.08, 0);
          playTone(587, 0.07, 'triangle', 0.08, 0.06);
          playTone(494, 0.07, 'triangle', 0.08, 0.12);
          playTone(392, 0.14, 'triangle', 0.08, 0.18);
        },
        talk() {
          playTone(520 + Math.random() * 110, 0.04, 'square', 0.03, 0);
        },
        kick() {
          playTone(150, 0.09, 'triangle', 0.09, 0);
          playTone(95, 0.08, 'sine', 0.08, 0.03);
        },
        goal() {
          playTone(523, 0.1, 'square', 0.06, 0);
          playTone(659, 0.1, 'square', 0.06, 0.1);
          playTone(784, 0.1, 'square', 0.06, 0.2);
          playTone(1046, 0.26, 'square', 0.07, 0.3);
        },
        blocked() {
          playTone(190, 0.08, 'sawtooth', 0.045, 0);
          playTone(145, 0.11, 'sawtooth', 0.045, 0.07);
        }
      };

      // Música de fondo estilo BeepBox 16-bit que se repite en bucle infinito al entrar al colegio
      const BGM = (() => {
        let timerId = null;
        let isPlaying = false;
        let step = 0;

        const BASS_SEQ = [
          130.81, 0, 164.81, 196.00, 220.00, 0, 196.00, 164.81,
          110.00, 0, 130.81, 164.81, 196.00, 0, 164.81, 130.81,
          174.61, 0, 220.00, 261.63, 293.66, 0, 261.63, 220.00,
          196.00, 0, 246.94, 293.66, 246.94, 0, 196.00, 146.83,
          130.81, 0, 164.81, 196.00, 261.63, 0, 196.00, 164.81,
          164.81, 0, 196.00, 246.94, 293.66, 0, 246.94, 196.00,
          146.83, 0, 174.61, 220.00, 261.63, 0, 220.00, 174.61,
          196.00, 246.94, 293.66, 349.23, 392.00, 0, 293.66, 196.00
        ];

        const LEAD_SEQ = [
          523.25, 0, 659.25, 587.33, 523.25, 392.00, 0, 440.00,
          523.25, 0, 493.88, 440.00, 392.00, 0, 0, 0,
          440.00, 0, 523.25, 587.33, 659.25, 0, 587.33, 523.25,
          587.33, 0, 493.88, 392.00, 493.88, 0, 587.33, 0,
          659.25, 0, 783.99, 659.25, 587.33, 523.25, 0, 440.00,
          493.88, 0, 587.33, 659.25, 587.33, 0, 493.88, 0,
          523.25, 0, 440.00, 349.23, 440.00, 0, 523.25, 587.33,
          493.88, 0, 392.00, 493.88, 523.25, 0, 0, 0
        ];

        function playStep() {
          if (!isPlaying || !soundEnabled) return;
          const ac = ensureAudio();
          if (!ac) return;

          const now = ac.currentTime;
          const idx = step % BASS_SEQ.length;
          const bassFreq = BASS_SEQ[idx];
          const leadFreq = LEAD_SEQ[idx];

          if (bassFreq > 0) {
            const bOsc = ac.createOscillator();
            const bGain = ac.createGain();
            bOsc.type = 'triangle';
            bOsc.frequency.setValueAtTime(bassFreq, now);
            bGain.gain.setValueAtTime(0.032, now);
            bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
            bOsc.connect(bGain);
            bGain.connect(ac.destination);
            bOsc.start(now);
            bOsc.stop(now + 0.22);
          }

          if (leadFreq > 0) {
            const lOsc = ac.createOscillator();
            const lGain = ac.createGain();
            lOsc.type = 'square';
            lOsc.frequency.setValueAtTime(leadFreq, now);
            lGain.gain.setValueAtTime(0.017, now);
            lGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.19);
            lOsc.connect(lGain);
            lGain.connect(ac.destination);
            lOsc.start(now);
            lOsc.stop(now + 0.2);
          }

          if (idx % 2 === 1) {
            const pOsc = ac.createOscillator();
            const pGain = ac.createGain();
            pOsc.type = 'sine';
            pOsc.frequency.setValueAtTime(idx % 4 === 3 ? 980 : 1320, now);
            pGain.gain.setValueAtTime(0.006, now);
            pGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.035);
            pOsc.connect(pGain);
            pGain.connect(ac.destination);
            pOsc.start(now);
            pOsc.stop(now + 0.04);
          }

          step = (step + 1) % BASS_SEQ.length;
        }

        return {
          start() {
            if (isPlaying) return;
            isPlaying = true;
            step = 0;
            playStep();
            timerId = setInterval(playStep, 254);
          },
          stop() {
            isPlaying = false;
            if (timerId) {
              clearInterval(timerId);
              timerId = null;
            }
          },
          syncMuteState() {
            if (soundEnabled && isPlaying) {
              playStep();
            }
          }
        };
      })();

      btnAudio.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnAudio.textContent = soundEnabled ? '🔊 AUDIO: ON' : '🔇 AUDIO: OFF';
        BGM.syncMuteState();
        if (soundEnabled) SFX.uiSelect();
      });

      // ======================================================================
      // 3. MOTOR DE PROYECCIÓN ISOMÉTRICA 2:1 Y DIBUJO DE BLOQUES 3D
      // ======================================================================
      function worldToIso(wx, wy, wz = 0, originX = 480, originY = 120) {
        return {
          x: Math.round(originX + (wx - wy)),
          y: Math.round(originY + (wx + wy) * 0.5 - wz)
        };
      }

      function isoToWorldDelta(dx, dy) {
        return {
          dwx: (dx * 0.5 + dy) * 0.85,
          dwy: (dy - dx * 0.5) * 0.85
        };
      }

      function drawIsoPoly(pts, fill, stroke = '#3A2F26', lineWidth = 1) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      function drawIsoBox(wx, wy, w, d, zBottom, height, colors, originX, originY) {
        const zTop = zBottom + height;
        const t0 = worldToIso(wx, wy, zTop, originX, originY);
        const t1 = worldToIso(wx + w, wy, zTop, originX, originY);
        const t2 = worldToIso(wx + w, wy + d, zTop, originX, originY);
        const t3 = worldToIso(wx, wy + d, zTop, originX, originY);

        if (height > 0) {
          const b1 = worldToIso(wx + w, wy, zBottom, originX, originY);
          const b2 = worldToIso(wx + w, wy + d, zBottom, originX, originY);
          const b3 = worldToIso(wx, wy + d, zBottom, originX, originY);

          if (colors.left) {
            drawIsoPoly([t3, t2, b2, b3], colors.left, colors.outline || '#3A2F26', 1);
          }
          if (colors.right) {
            drawIsoPoly([t2, t1, b1, b2], colors.right, colors.outline || '#3A2F26', 1);
          }
        }

        if (colors.top) {
          drawIsoPoly([t0, t1, t2, t3], colors.top, colors.outline || '#3A2F26', 1);
        }
      }

      function drawIsoLabel(text, sx, sy, bg = 'rgba(38,54,53,0.92)', fg = '#DEDBD0', border = '#D9B656') {
        ctx.font = 'bold 10px "Courier New", monospace';
        const w = Math.ceil(ctx.measureText(text).width) + 12;
        const h = 16;
        const rx = Math.round(sx - w / 2);
        const ry = Math.round(sy - h / 2);

        ctx.fillStyle = bg;
        ctx.fillRect(rx, ry, w, h);
        if (border) {
          ctx.strokeStyle = border;
          ctx.lineWidth = 1;
          ctx.strokeRect(rx + 0.5, ry + 0.5, w - 1, h - 1);
        }
        ctx.fillStyle = fg;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, Math.round(sx), Math.round(sy) + 0.5);
      }

      function drawActionMarker(sx, sy, symbol = '!', color = '#D9B656') {
        const bob = Math.round(Math.sin(gameState.animTime * 5) * 2);
        const bx = Math.round(sx - 7);
        const by = Math.round(sy - 8 + bob);
        ctx.fillStyle = '#3A2F26';
        ctx.fillRect(bx - 1, by - 1, 16, 16);
        ctx.fillStyle = color;
        ctx.fillRect(bx, by, 14, 14);
        ctx.fillStyle = '#3A2F26';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(symbol, bx + 7, by + 8);
      }

      function drawIsoMat(wx, wy, w, d, originX, originY, colorA = '#D9B656', colorB = '#617B56') {
        const pulse = Math.sin(gameState.animTime * 5) > 0;
        const p0 = worldToIso(wx, wy, 0.5, originX, originY);
        const p1 = worldToIso(wx + w, wy, 0.5, originX, originY);
        const p2 = worldToIso(wx + w, wy + d, 0.5, originX, originY);
        const p3 = worldToIso(wx, wy + d, 0.5, originX, originY);
        drawIsoPoly([p0, p1, p2, p3], pulse ? colorA : colorB, '#3A2F26', 1.5);
      }

      // ======================================================================
      // 4. GENERADOR DE SPRITES PIXEL-ART 64-BIT ISOMÉTRICOS (42x56 PX)
      // ======================================================================
      const spriteCache = new Map();

      function getRolePalette(role) {
        const base = {
          hair: '#3A2F26',
          hairHi: '#78563A',
          skin: '#D6A87C',
          skinShade: '#9F6E46',
          shirt: '#DEDBD0',
          shirtShade: '#C7BCA1',
          collar: '#4B6374',
          badge: '#D9B656',
          pants: '#4B6374',
          pantsShade: '#263635',
          shoe: '#3A2F26',
          sole: '#DEDBD0',
          hasBackpack: false,
          packMain: '#617B56',
          packShade: '#3A2F26',
          packStrap: '#9F6E46',
          isFemale: false,
          isSkirt: false,
          hasCord: false
        };

        switch (role) {
          case 'boy':
            return { ...base, hasBackpack: true };
          case 'girl':
            return { ...base, isFemale: true, isSkirt: true, hasBackpack: true, badge: '#A65A4E' };
          case 'student_m':
            return { ...base, hasBackpack: Math.random() > 0.4, hair: '#3A2F26' };
          case 'student_f':
            return { ...base, isFemale: true, isSkirt: true, hair: '#3A2F26', badge: '#A65A4E' };
          case 'brigadier':
            return { ...base, isFemale: true, isSkirt: true, hasCord: true, badge: '#D9B656' };
          case 'policia':
            return { ...base, hasCord: true, collar: '#A65A4E', badge: '#D9B656' };
          case 'sport_green':
            return { ...base, shirt: '#617B56', shirtShade: '#3A2F26', collar: '#D9B656', pants: '#263635' };
          case 'sport_terra':
            return { ...base, isFemale: true, shirt: '#A65A4E', shirtShade: '#78563A', collar: '#DEDBD0', pants: '#263635' };
          case 'teacher_m':
            return { ...base, shirt: '#4B6374', shirtShade: '#263635', collar: '#DEDBD0', pants: '#3A2F26', hair: '#3A2F26' };
          case 'teacher_f':
            return { ...base, isFemale: true, shirt: '#A65A4E', shirtShade: '#78563A', collar: '#DEDBD0', pants: '#3A2F26' };
          case 'principal':
            return { ...base, shirt: '#3A2F26', shirtShade: '#263635', collar: '#D9B656', pants: '#3A2F26', hair: '#8A7F6A', hairHi: '#DEDBD0' };
          case 'nurse':
            return { ...base, isFemale: true, shirt: '#DEDBD0', shirtShade: '#C7BCA1', collar: '#A65A4E', pants: '#4B6374' };
          case 'kiosco_lady':
            return { ...base, isFemale: true, shirt: '#A65A4E', shirtShade: '#78563A', collar: '#D9B656', pants: '#3A2F26' };
          case 'auxiliar':
            return { ...base, shirt: '#4B6374', shirtShade: '#263635', collar: '#D9B656', pants: '#3A2F26', hair: '#3A2F26' };
          default:
            return base;
        }
      }

      function build64BitIsoSprite(role, dir, step) {
        const key = `${role}_${dir}_${step}`;
        if (spriteCache.has(key)) return spriteCache.get(key);

        const c = document.createElement('canvas');
        c.width = 42;
        c.height = 56;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = false;

        const p = getRolePalette(role);
        const isBack = dir === 'NW' || dir === 'NE';
        const flipX = dir === 'SW' || dir === 'NW';
        const bob = step === 1 ? -1 : 0;

        g.save();
        if (flipX) {
          g.translate(42, 0);
          g.scale(-1, 1);
        }

        const px = (x, y, w, h, col) => {
          g.fillStyle = col;
          g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        };

        // 1. Sombra isométrica en el suelo
        px(11, 49, 20, 4, 'rgba(58, 47, 38, 0.35)');
        px(14, 48, 14, 6, 'rgba(58, 47, 38, 0.42)');

        // 2. Piernas y zapatos escolares
        const legShiftA = step === 1 ? -2 : 0;
        const legShiftB = step === 1 ? 2 : 0;

        px(14, 37 + legShiftA, 6, 11, '#3A2F26');
        px(15, 37 + legShiftA, 4, 10, p.pantsShade);
        px(13, 46 + legShiftA, 7, 4, '#3A2F26');
        px(14, 47 + legShiftA, 5, 2, p.shoe);
        px(14, 49 + legShiftA, 5, 1, p.sole);

        px(21, 38 + legShiftB, 6, 11, '#3A2F26');
        px(22, 38 + legShiftB, 4, 10, p.pants);
        px(21, 47 + legShiftB, 7, 4, '#3A2F26');
        px(22, 48 + legShiftB, 5, 2, p.shoe);
        px(22, 49 + legShiftB, 5, 1, p.sole);

        if (p.isSkirt) {
          px(13, 35 + bob, 16, 7, '#3A2F26');
          px(14, 36 + bob, 7, 5, p.pantsShade);
          px(21, 36 + bob, 7, 5, p.pants);
        }

        // 3. Mochila escolar (lado izquierdo en vista isométrica)
        if (p.hasBackpack) {
          px(7, 22 + bob, 9, 15, '#3A2F26');
          px(8, 23 + bob, 7, 13, p.packMain);
          px(8, 23 + bob, 3, 13, p.packShade);
          px(10, 29 + bob, 4, 5, p.packShade);
          px(11, 28 + bob, 2, 1, '#D9B656');
          px(10, 20 + bob, 3, 2, p.packStrap);
        }

        // 4. Torso con camisa escolar e insignia
        px(13, 22 + bob, 16, 15, '#3A2F26');
        px(14, 23 + bob, 6, 13, p.shirtShade);
        px(20, 23 + bob, 8, 13, p.shirt);

        if (!isBack) {
          px(20, 23 + bob, 7, 3, p.collar);
          px(22, 24 + bob, 3, 2, p.shirt);
          px(24, 27 + bob, 3, 3, p.badge);
        } else {
          px(15, 23 + bob, 12, 2, p.collar);
        }

        if (p.hasCord) {
          px(17, 24 + bob, 2, 8, '#D9B656');
          px(18, 26 + bob, 2, 7, '#A65A4E');
        }

        // 5. Brazo visible
        px(15, 24 + bob - legShiftA * 0.5, 5, 12, '#3A2F26');
        px(16, 25 + bob - legShiftA * 0.5, 3, 4, p.shirt);
        px(16, 28 + bob - legShiftA * 0.5, 3, 1, p.collar);
        px(16, 29 + bob - legShiftA * 0.5, 3, 6, p.skin);

        // 6. Cabeza 64-bit con sombreado y cabello
        px(12, 7 + bob, 18, 16, '#3A2F26');
        px(13, 9 + bob, 16, 13, p.skin);
        px(13, 10 + bob, 4, 12, p.skinShade);

        px(12, 6 + bob, 18, 6, p.hair);
        px(15, 7 + bob, 11, 2, p.hairHi);
        px(12, 10 + bob, 4, 6, p.hair);

        if (p.isFemale) {
          px(11, 11 + bob, 4, 13, '#3A2F26');
          px(12, 11 + bob, 3, 12, p.hair);
          px(11, 10 + bob, 3, 2, '#A65A4E');
        }

        if (isBack) {
          px(13, 9 + bob, 16, 11, p.hair);
          px(16, 8 + bob, 9, 3, p.hairHi);
        } else {
          px(21, 14 + bob, 2, 4, '#3A2F26');
          px(26, 14 + bob, 2, 4, '#3A2F26');
          px(21, 14 + bob, 1, 1, '#DEDBD0');
          px(26, 14 + bob, 1, 1, '#DEDBD0');
        }

        g.restore();
        spriteCache.set(key, c);
        return c;
      }

      function drawIsoSprite(role, wx, wy, dir, step, originX, originY, scale = 1) {
        const sprite = build64BitIsoSprite(role, dir, step);
        const pos = worldToIso(wx, wy, 0, originX, originY);
        const dw = Math.round(42 * scale);
        const dh = Math.round(56 * scale);
        ctx.drawImage(sprite, Math.round(pos.x - dw / 2), Math.round(pos.y - dh + 6), dw, dh);
      }

      // ======================================================================
      // 7. HELPERS DE NAVEGACIÓN, TRANSICIONES Y DIÁLOGOS
      // ======================================================================
      function updateHudLocation(text, isFloor2 = false) {
        hudLocation.innerHTML = `<span>${text}</span>`;
        hudLocation.classList.toggle('floor-2', isFloor2);
      }

      function showBanner(text, subtext = '', color = '#D9B656', duration = 2.4) {
        gameState.banner.text = text;
        gameState.banner.subtext = subtext;
        gameState.banner.color = color;
        gameState.banner.timer = duration;
      }

      function setScreen(screenName) {
        gameState.screen = screenName;
        const inGame = screenName === 'GAME';
        hudBar.classList.toggle('is-hidden', !inGame);
        touchControls.classList.toggle('is-hidden', !inGame);
        resizeCanvas();
      }

      function triggerTransition(callback) {
        if (gameState.fadeMode !== 'none') return;
        gameState.fadeMode = 'out';
        gameState.pendingTransition = callback;
      }

      function openDialogue(speaker, lines) {
        if (!lines || lines.length === 0) return;
        gameState.dialogue.active = true;
        gameState.dialogue.speaker = speaker;
        gameState.dialogue.lines = lines;
        gameState.dialogue.lineIndex = 0;
        gameState.dialogue.charIndex = 0;
        gameState.dialogue.charTimer = 0;
        SFX.talk();
      }

      function advanceDialogue() {
        const d = gameState.dialogue;
        if (!d.active) return;
        const currentLine = d.lines[d.lineIndex];
        if (d.charIndex < currentLine.length) {
          d.charIndex = currentLine.length;
          return;
        }
        if (d.lineIndex + 1 < d.lines.length) {
          d.lineIndex++;
          d.charIndex = 0;
          d.charTimer = 0;
          SFX.talk();
        } else {
          d.active = false;
        }
      }

      function startGameFromMenu() {
        SFX.uiConfirm();
        BGM.start();
        triggerTransition(() => {
          gameState.completedMissions = [];
          gameState.missionTimeLeft = 10 * 60;
          gameState.hasSpatula = false;
          gameState.repairedWallIds = [];
          gameState.collectedQuestItems = [];
          gameState.storyPhase = 'COMIC';
          gameState.storyElapsed = 0;
          setScreen('STORY');
        });
      }

      function advanceComic() {
        if (gameState.storyPhase !== 'COMIC') return;
        const panelDuration = 3.6;
        const panel = Math.floor(gameState.storyElapsed / panelDuration);
        if (panel >= 4) {
          gameState.storyPhase = 'BRIEFING';
        } else {
          gameState.storyElapsed = (panel + 1) * panelDuration;
        }
      }

      function beginAdventure() {
        SFX.uiConfirm();
        triggerTransition(() => {
          setScreen('GAME');
          gameState.scene = 'CAMPUS';
          gameState.currentBuildingId = null;
          gameState.currentFloor = 1;
          gameState.currentRoom = null;
          gameState.portalCooldown = 0.5;
          player.wx = 205;
          player.wy = 225;
          player.dir = 'SE';
          gameState.dialogue.active = false;
          updateHudLocation('📍 PATIO PRINCIPAL · CAMPUS', false);
          const charLabel = gameState.selectedChar === 'girl' ? 'LA ESTUDIANTE' : 'EL ESTUDIANTE';
          showBanner(`¡BIENVENIDO/A, ${charLabel}!`, 'Usa las flechas para explorar y [E] para hablar con todos', '#D9B656', 3.0);
        });
      }

      function completeMission(id) {
        if (gameState.screen !== 'GAME' || gameState.completedMissions.includes(id)) return;
        const mission = MISSION_DEFS.find(item => item.id === id);
        if (!mission) return;
        gameState.completedMissions.push(id);
        SFX.uiConfirm();
        const done = gameState.completedMissions.length;
        showBanner(`✓ MISIÓN COMPLETADA (${done}/${MISSION_DEFS.length})`, mission.text, '#617B56', 2.5);
        if (done === MISSION_DEFS.length) {
          BGM.stop();
          setScreen('VICTORY');
        }
      }

      btnOpenMenu.addEventListener('click', () => {
        SFX.uiSelect();
        BGM.stop();
        gameState.dialogue.active = false;
        triggerTransition(() => {
          setScreen('MENU');
        });
      });

      btnCampusReset.addEventListener('click', () => {
        if (gameState.scene !== 'CAMPUS' && gameState.currentFloor > 1) {
          SFX.blocked();
          showBanner('⚠ ESTÁS EN EL 2° PISO', 'Baja por las escaleras al 1° piso para poder salir al patio', '#A65A4E', 2.5);
          return;
        }
        if (gameState.dialogue.active) gameState.dialogue.active = false;
        returnToCampus({ wx: 205, wy: 225 });
        showBanner('📍 PATIO PRINCIPAL', 'Vista isométrica general del campus', '#D9B656', 1.8);
      });

      function enterBuildingHallway(buildingId, floor = 1, customSpawn = null) {
        const b = BUILDINGS[buildingId];
        if (!b) return;
        SFX.door();
        triggerTransition(() => {
          gameState.scene = 'HALLWAY';
          gameState.currentBuildingId = buildingId;
          gameState.currentFloor = floor;
          gameState.currentRoom = null;
          gameState.portalCooldown = 0.5;

          if (customSpawn) {
            player.wx = customSpawn.wx;
            player.wy = customSpawn.wy;
          } else {
            player.wx = 160;
            player.wy = 152;
            player.dir = 'NW';
          }

          const floorInfo = b.floors[floor];
          updateHudLocation(`🏢 ${floorInfo.label.toUpperCase()}`, floor === 2);
          showBanner(
            floorInfo.label.toUpperCase(),
            b.hasStairs ? 'Usa las escaleras isométricas para cambiar de piso' : 'Explora las oficinas',
            floor === 2 ? '#617B56' : '#D9B656',
            2.1
          );
        });
      }

      function useStairs(targetFloor) {
        const b = BUILDINGS[gameState.currentBuildingId];
        if (!b || !b.floors[targetFloor]) return;

        if (targetFloor > gameState.currentFloor) SFX.stairsUp();
        else SFX.stairsDown();

        triggerTransition(() => {
          gameState.currentFloor = targetFloor;
          gameState.portalCooldown = 0.6;
          player.wx = 64;
          player.wy = 98;
          player.dir = 'SE';

          const floorInfo = b.floors[targetFloor];
          updateHudLocation(`🏢 ${floorInfo.label.toUpperCase()}`, targetFloor === 2);

          if (targetFloor === 2) {
            showBanner('▲ SUBISTE AL 2° PISO', `${b.name} — Nivel Superior (Baja por escaleras para salir)`, '#617B56', 2.6);
            completeMission('second_floor');
          } else {
            showBanner('▼ BAJASTE AL 1° PISO', `${b.name} — Nivel Inferior (Salida al patio habilitada)`, '#D9B656', 2.6);
          }
        });

      function enterSpecificRoom(roomData, returnWx) {
        SFX.door();
        triggerTransition(() => {
          gameState.scene = 'ROOM';
          gameState.currentRoom = roomData;
          gameState.lastHallwayReturnPos = { wx: returnWx, wy: 44 };
          gameState.portalCooldown = 0.5;

          player.wx = 135;
          player.wy = 182;
          player.dir = 'NW';

          const b = BUILDINGS[gameState.currentBuildingId];
          const floorSuffix = b && b.hasStairs ? ` (${gameState.currentFloor}° PISO)` : '';
          updateHudLocation(`🚪 ${roomData.doorLabel}${floorSuffix}`, gameState.currentFloor === 2);
          showBanner(roomData.roomTitle.toUpperCase(), 'Presiona [E] cerca de la pizarra o personas', '#617B56', 2.1);
        });
      }

      function enterDirectRoom(directRoomData) {
        SFX.door();
        triggerTransition(() => {
          gameState.scene = 'ROOM';
          gameState.currentBuildingId = null;
          gameState.currentRoom = directRoomData;
          gameState.lastDirectExitPos = { ...directRoomData.campusExit };
          gameState.portalCooldown = 0.5;

          player.wx = 135;
          player.wy = 182;
          player.dir = 'NW';

          updateHudLocation(directRoomData.hudLabel, false);
          showBanner(directRoomData.roomTitle.toUpperCase(), 'Presiona [E] para interactuar', '#617B56', 2.1);
        });
      }

      function returnToCampus(customPos = null) {
        SFX.door();
        triggerTransition(() => {
          let exitPos = customPos || { wx: 205, wy: 225 };
          if (!customPos) {
            if (gameState.currentBuildingId && BUILDINGS[gameState.currentBuildingId]) {
              exitPos = BUILDINGS[gameState.currentBuildingId].campusExit;
            } else if (gameState.currentRoom && gameState.currentRoom.campusExit) {
              exitPos = gameState.currentRoom.campusExit;
            }
          }

          gameState.scene = 'CAMPUS';
          gameState.currentBuildingId = null;
          gameState.currentRoom = null;
          gameState.portalCooldown = 0.5;

          player.wx = exitPos.wx;
          player.wy = exitPos.wy;
          player.dir = 'SE';

          updateHudLocation('📍 PATIO PRINCIPAL · CAMPUS', false);
        });
      }

      // ======================================================================
      // 8. COLISIONES E INTERACCIÓN EN ESCENARIOS ISOMÉTRICOS
      // ======================================================================
      function boxesOverlap(a, b) {
        return a.wx < b.wx + b.w && a.wx + a.w > b.wx && a.wy < b.wy + b.d && a.wy + a.d > b.wy;
      }

      function getPlayerBox(wx, wy) {
        return { wx: wx - 7, wy: wy - 7, w: 14, d: 14 };
      }

        if (gameState.scene === 'CAMPUS') {

          list.push({ wx: 170, wy: 444, w: 72, d: 16 });  // Límite Portón

          list.push({ wx: 316, wy: 0, w: 24, d: 200 });
          list.push({ wx: -20, wy: 186, w: 360, d: 24 });

          // Bancas laterales bien separadas de la última puerta
          list.push({ wx: 282, wy: 38, w: 24, d: 42 });
          list.push({ wx: 282, wy: 112, w: 24, d: 42 });

          const b = BUILDINGS[gameState.currentBuildingId];
          const floorInfo = b.floors[gameState.currentFloor];
          if (floorInfo && floorInfo.hallwayNpcs) {

              }
            }

              }
            }
          } else if (r.type === 'science_lab' || r.type === 'robotics_lab') {
            list.push({ wx: 54, wy: 76, w: 66, d: 26 });
            list.push({ wx: 156, wy: 76, w: 66, d: 26 });
            list.push({ wx: 54, wy: 148, w: 66, d: 26 });
            list.push({ wx: 156, wy: 148, w: 66, d: 26 });
          } else if (r.type === 'principal_office') {
            list.push({ wx: 96, wy: 68, w: 78, d: 28 });
            list.push({ wx: 18, wy: 16, w: 44, d: 18 });

      function getHallwayDoors(rooms) {
        const count = rooms.length;
        const startWx = 96;
        const span = count > 1 ? 144 : 0;
        return rooms.map((room, idx) => {
          const dwx = count === 1 ? 156 : Math.round(startWx + (span / (count - 1)) * idx);
          return { room, wx: dwx, wy: 4, w: 28, d: 16 };
        });
      }

      function getCurrentWallTargets() {
        if (gameState.scene === 'CAMPUS') {
          return CAMPUS_BUILDINGS.map(b => {
            const southSide = !!b.doorSouth;
            const leftX = b.wx + b.w * 0.2;
            const rightX = b.wx + b.w * 0.8;
            const doorCenterX = b.doorWx + 10;
            const targetX = Math.abs(leftX - doorCenterX) > Math.abs(rightX - doorCenterX) ? leftX : rightX;
            return {
              id: `campus:${b.id}`,
              wx: southSide ? targetX : b.wx + b.w + 0.5,
              wy: southSide ? b.wy + b.d + 0.5 : b.wy + b.d * 0.5,
              wz: Math.max(18, b.h * 0.58),
              side: southSide ? 'south' : 'east'
            };
          });
        }
        if (gameState.scene === 'HALLWAY') {
          const suffix = `${gameState.currentBuildingId}:${gameState.currentFloor}`;
          return [
            { id: `hallway:${suffix}:left`, wx: 1, wy: 142, wz: 35, side: 'west' },
            { id: `hallway:${suffix}:right`, wx: 319, wy: 142, wz: 35, side: 'east' }
          ];
        }
        if (gameState.scene === 'ROOM' && gameState.currentRoom) {
          const id = gameState.currentRoom.id;
          return [
            { id: `room:${id}:left`, wx: 1, wy: 132, wz: 39, side: 'west' },
            { id: `room:${id}:right`, wx: 269, wy: 132, wz: 39, side: 'east' }
          ];
        }
        return [];
      }

      function drawWallDamage(wall, originX, originY) {
        if (gameState.repairedWallIds.includes(wall.id)) return;
        const anchor = worldToIso(wall.wx, wall.wy, wall.wz, originX, originY);
        const shake = Math.round(Math.sin(gameState.animTime * 24 + wall.wx) * 2);
        const direction = wall.side === 'west' ? -1 : 1;
        const crack = [
          [-18, -10], [-10, -1], [-3, -5], [4, 4], [10, 1], [17, 13]
        ].map(([x, y]) => ({ x: anchor.x + direction * x + shake, y: anchor.y + y }));

        ctx.save();
        ctx.lineCap = 'square';
        ctx.lineJoin = 'miter';
        ctx.strokeStyle = '#3A2F26';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(crack[0].x, crack[0].y);
        for (let i = 1; i < crack.length; i++) ctx.lineTo(crack[i].x, crack[i].y);
        ctx.stroke();
        ctx.strokeStyle = '#A65A4E';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(crack[0].x, crack[0].y);
        for (let i = 1; i < crack.length; i++) ctx.lineTo(crack[i].x, crack[i].y);
        ctx.stroke();

        const fall = (gameState.animTime * 12) % 12;
        ctx.fillStyle = '#8A7F6A';
        ctx.fillRect(anchor.x - 7 + shake, anchor.y + 17 + fall, 6, 5);
        ctx.fillStyle = '#A65A4E';
        ctx.fillRect(anchor.x + 8 + shake, anchor.y + 11 + ((fall + 5) % 10), 5, 4);
        drawActionMarker(anchor.x, anchor.y - 28, '!', '#A65A4E');
        ctx.restore();
      }

      function drawSpatulaItem(wx, wy, ox, oy) {
        const pos = worldToIso(wx, wy, 3, ox, oy);
        const bob = Math.round(Math.sin(gameState.animTime * 5) * 3);
        drawIsoMat(wx - 8, wy - 6, 16, 12, ox, oy, '#D9B656', '#617B56');
        ctx.save();
        ctx.translate(pos.x, pos.y + bob);
        ctx.rotate(-0.42);
        ctx.fillStyle = '#3A2F26'; ctx.fillRect(-2, -19, 5, 18);
        ctx.fillStyle = '#9F6E46'; ctx.fillRect(-1, -18, 3, 12);
        ctx.fillStyle = '#3A2F26'; ctx.fillRect(-9, -27, 19, 11);
        ctx.fillStyle = '#DEDBD0'; ctx.fillRect(-7, -25, 15, 7);
        ctx.fillStyle = '#8A7F6A'; ctx.fillRect(-4, -23, 8, 3);
        ctx.restore();
        drawActionMarker(pos.x, pos.y - 34 + bob, 'F', '#D9B656');
        drawIsoLabel('ESPÁTULA', pos.x, pos.y + 19 + bob, '#263635', '#DEDBD0', '#D9B656');
      }

      function matchesSceneLocation(location) {
        if (!location || gameState.scene !== location.scene) return false;
        if (location.scene === 'ROOM') return gameState.currentRoom && gameState.currentRoom.id === location.roomId;
        if (location.scene === 'HALLWAY') {
          return gameState.currentBuildingId === location.buildingId && gameState.currentFloor === location.floor;
        }
        return true;
      }

      function getNearbyFInteraction() {
        if (gameState.screen !== 'GAME' || gameState.dialogue.active || gameState.fadeMode !== 'none') return null;
        if (gameState.scene === 'CAMPUS' && !gameState.hasSpatula && Math.hypot(player.wx - spatulaItem.wx, player.wy - spatulaItem.wy) < 34) {
          return { kind: 'spatula', text: 'Recoger espátula' };
        }

        for (const mission of MISSION_DEFS) {
          if (gameState.completedMissions.includes(mission.id)) continue;
          const collected = gameState.collectedQuestItems.includes(mission.id);
          const location = collected ? mission.use : mission.find;
          if (!matchesSceneLocation(location)) continue;
          if (Math.hypot(player.wx - location.wx, player.wy - location.wy) < 36) {
            return { kind: collected ? 'use' : 'collect', mission, text: `${collected ? 'Usar' : 'Recoger'} ${mission.name}` };
          }
        }
        return null;
      }

      function interactWithFObject() {
        const target = getNearbyFInteraction();
        if (!target) return;
        ensureAudio();
        if (target.kind === 'spatula') {
          gameState.hasSpatula = true;
          SFX.uiConfirm();
          showBanner('🔧 ¡ENCONTRASTE UNA ESPÁTULA!', 'Acércate a una grieta y pulsa [R] para reparar la pared', '#617B56', 3.2);
          return;
        }
        const mission = target.mission;
        if (target.kind === 'collect') {
          gameState.collectedQuestItems.push(mission.id);
          SFX.uiSelect();
          showBanner(`📦 ${mission.name.toUpperCase()} ENCONTRADO`, 'Llévalo al lugar indicado y pulsa [F] para usarlo', '#D9B656', 3.0);
          return;
        }

        if (mission.id === 'soccer_ball') kickSoccerBall(195);
        gameState.completedMissions.push(mission.id);
        SFX.uiConfirm();
        showBanner(`✓ MISIÓN ${gameState.completedMissions.length}/${MISSION_DEFS.length}`, mission.text, '#617B56', 2.6);
        if (gameState.completedMissions.length === MISSION_DEFS.length) {
          BGM.stop();
          setScreen('VICTORY');
        }
      }

      function drawMissionObject(mission, location, ox, oy) {
        const pos = worldToIso(location.wx, location.wy, 4, ox, oy);
        const bob = Math.round(Math.sin(gameState.animTime * 5 + location.wx) * 2);
        drawIsoMat(location.wx - 7, location.wy - 5, 14, 10, ox, oy, '#D9B656', '#617B56');
        ctx.save();
        ctx.translate(pos.x, pos.y + bob);
        ctx.fillStyle = '#3A2F26';
        ctx.beginPath(); ctx.ellipse(0, 2, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
        switch (mission.icon) {
          case 'hammer':
            ctx.rotate(-0.42);
            ctx.fillStyle = '#9F6E46'; ctx.fillRect(-2, -18, 4, 20);
            ctx.fillStyle = '#8A7F6A'; ctx.fillRect(-10, -23, 20, 8);
            ctx.fillStyle = '#DEDBD0'; ctx.fillRect(-8, -21, 16, 3);
            break;
          case 'meteorite':
            ctx.fillStyle = '#A65A4E'; ctx.beginPath(); ctx.arc(0, -9, 13, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#555650'; ctx.beginPath(); ctx.arc(0, -11, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#D9783F'; ctx.fillRect(-15, -7, 6, 4); ctx.fillRect(8, -19, 7, 4);
            break;
          case 'box':
          case 'crate':
            ctx.fillStyle = '#78563A'; ctx.fillRect(-13, -22, 26, 19);
            ctx.fillStyle = mission.icon === 'crate' ? '#9F6E46' : '#C7BCA1'; ctx.fillRect(-10, -20, 20, 14);
            ctx.fillStyle = '#78563A'; ctx.fillRect(-2, -20, 4, 14);
            ctx.fillRect(-10, -14, 20, 3);
            break;
          case 'beach':
          case 'soccer':
          case 'volleyball':
          case 'basketball': {
            const colors = { beach: '#4B6374', soccer: '#DEDBD0', volleyball: '#DEDBD0', basketball: '#D9783F' };
            ctx.fillStyle = colors[mission.icon];
            ctx.beginPath(); ctx.arc(0, -11, 12, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = mission.icon === 'volleyball' ? '#8A7F6A' : '#3A2F26';
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (mission.icon === 'beach') {
              ctx.moveTo(-10, -17); ctx.lineTo(9, -5);
              ctx.moveTo(-10, -7); ctx.lineTo(8, -19);
            } else if (mission.icon === 'soccer') {
              ctx.moveTo(-8, -15); ctx.lineTo(0, -20); ctx.lineTo(8, -15); ctx.lineTo(6, -7); ctx.lineTo(-3, -6); ctx.closePath();
            } else if (mission.icon === 'volleyball') {
              ctx.moveTo(-8, -20); ctx.quadraticCurveTo(0, -11, -8, -2);
              ctx.moveTo(0, -22); ctx.quadraticCurveTo(10, -11, 0, 0);
            } else {
              ctx.moveTo(-11, -13); ctx.quadraticCurveTo(0, -11, 11, -9);
              ctx.moveTo(-10, -7); ctx.quadraticCurveTo(0, -11, 10, -15);
              ctx.moveTo(0, -23); ctx.quadraticCurveTo(-5, -11, 0, 1);
            }
            ctx.stroke();
            if (mission.icon === 'beach') {
              ctx.strokeStyle = '#A65A4E'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 0); ctx.stroke();
            }
            break;
          }
        }
        ctx.restore();
        drawActionMarker(pos.x, pos.y - 35 + bob, 'F', '#D9B656');
        drawIsoLabel(mission.name.toUpperCase(), pos.x, pos.y + 16 + bob, '#263635', '#DEDBD0', '#D9B656');
      }

      function drawCurrentMissionObjects(ox, oy) {
        for (const mission of MISSION_DEFS) {
          if (gameState.completedMissions.includes(mission.id)) continue;
          const collected = gameState.collectedQuestItems.includes(mission.id);
          const location = collected ? mission.use : mission.find;
          if (matchesSceneLocation(location)) drawMissionObject(mission, location, ox, oy);
        }
      }

      function attemptWallRepair() {
        if (gameState.screen !== 'GAME' || gameState.dialogue.active || gameState.fadeMode !== 'none') return;
        const nearest = getCurrentWallTargets()
          .filter(wall => !gameState.repairedWallIds.includes(wall.id))
          .map(wall => ({ wall, distance: Math.hypot(player.wx - wall.wx, player.wy - wall.wy) }))
          .sort((a, b) => a.distance - b.distance)[0];

        if (!nearest || nearest.distance > 50) {
          showBanner('ACÉRCATE A UNA PARED DAÑADA', 'Ponte junto a la grieta y pulsa [R] para repararla', '#D9B656', 2.2);
          return;
        }
        if (!gameState.hasSpatula) {
          showBanner('TE FALTA LA ESPÁTULA', 'Encuéntrala en el patio principal y vuelve a esta pared', '#A65A4E', 2.4);
          return;
        }

        gameState.repairedWallIds.push(nearest.wall.id);
        SFX.uiConfirm();
        const remaining = getCurrentWallTargets().filter(wall => !gameState.repairedWallIds.includes(wall.id)).length;
        showBanner('🧱 ¡PARED REPARADA!', remaining ? `Quedan ${remaining} paredes dañadas en esta zona` : 'Esta zona ya está segura', '#617B56', 2.4);
      }

      function handleInteractPressed() {
        ensureAudio();

        if (gameState.screen === 'MENU') {
          if (gameState.menuFocus === 0) {
            startGameFromMenu();
          } else {
            SFX.uiSelect();
            gameState.selectFocus = gameState.selectedChar === 'girl' ? 1 : 0;
            setScreen('CHAR_SELECT');
          }
          return;
        }

        if (gameState.screen === 'CHAR_SELECT') {
          SFX.uiConfirm();
          setScreen('MENU');
          return;
        }

        if (gameState.screen === 'STORY') {
          if (gameState.storyPhase === 'COMIC') advanceComic();
          else beginAdventure();
          return;
        }

        if (gameState.screen === 'VICTORY' || gameState.screen === 'DEFEAT') {
          BGM.stop();
          setScreen('MENU');
          return;
        }

        if (gameState.dialogue.active) {
          advanceDialogue();
          return;
        }

        if (gameState.fadeMode !== 'none') return;

        if (gameState.scene === 'CAMPUS') {
          if (!gameState.hasSpatula && Math.hypot(player.wx - spatulaItem.wx, player.wy - spatulaItem.wy) < 32) {
            gameState.hasSpatula = true;
            SFX.uiConfirm();
            showBanner('🔧 ¡ENCONTRASTE UNA ESPÁTULA!', 'Acércate a una grieta y pulsa [R] para reparar la pared', '#617B56', 3.2);
            return;
          }

          for (const npc of CAMPUS_NPCS) {
            if (Math.hypot(player.wx - npc.wx, player.wy - npc.wy) < 34) {
              openDialogue(npc.name, npc.dialog);
              if (npc.id === 'auxiliar') completeMission('auxiliar');
              return;
            }
          }

          if (player.wx >= 90 && player.wx <= 170 && player.wy >= 92 && player.wy <= 135) {
            openDialogue('Estrado Cívico y Pabellón Nacional', [
              'Cada lunes a las 7:45 a.m., toda la comunidad educativa forma en el Patio Principal para entonar el Himno Nacional del Perú.',
              'La escolta de 5° de Secundaria porta con orgullo nuestro Pabellón Nacional.'
            ]);
            return;
          }

          if (Math.hypot(player.wx - soccerBall.wx, player.wy - soccerBall.wy) < 28) {
            kickSoccerBall(195);
            return;
          }

          for (const b of CAMPUS_BUILDINGS) {
            const cx = b.doorWx + 10;
            const cy = b.doorWy + 6;
            if (Math.hypot(player.wx - cx, player.wy - cy) < 28) {
              if (b.id === 'kiosco') enterDirectRoom(DIRECT_ROOMS.kiosco);
              else if (b.id === 'sshh') enterDirectRoom(DIRECT_ROOMS.sshh);
              else enterBuildingHallway(b.id, 1);
              return;
            }
          }
        } else if (gameState.scene === 'HALLWAY') {
          const b = BUILDINGS[gameState.currentBuildingId];
          const floorInfo = b.floors[gameState.currentFloor];

          if (floorInfo.hallwayNpcs) {
            for (const npc of floorInfo.hallwayNpcs) {
              if (Math.hypot(player.wx - npc.wx, player.wy - npc.wy) < 34) {
                openDialogue(npc.name, npc.dialog);
                return;
              }
            }
          }

          if (player.wx <= 85 && player.wy <= 42) {
            openDialogue(floorInfo.muralTitle, floorInfo.muralText);
            return;
          }

          if (b.hasStairs && player.wx <= 48 && player.wy >= 65 && player.wy <= 135) {
            useStairs(gameState.currentFloor === 1 ? 2 : 1);
            return;
          }

          if (gameState.currentFloor > 1 && player.wy >= 162) {
            SFX.blocked();
            showBanner('🧱 BARANDA DEL 2° PISO', 'Baja por las escaleras al 1° piso para salir al patio', '#D9B656', 2.3);
            return;
          }

          const doors = getHallwayDoors(floorInfo.rooms);
          for (const d of doors) {
            if (Math.hypot(player.wx - (d.wx + d.w / 2), player.wy - (d.wy + 12)) < 28) {
              enterSpecificRoom(d.room, d.wx + d.w / 2);
              return;
            }
          }
        } else if (gameState.scene === 'ROOM' && gameState.currentRoom) {
          const r = gameState.currentRoom;

          if (r.teacher) {
            const twx = r.type === 'kiosco' ? 135 : (r.type === 'principal_office' ? 135 : 58);
            const twy = r.type === 'kiosco' ? 66 : (r.type === 'principal_office' ? 50 : 24);
            if (Math.hypot(player.wx - twx, player.wy - twy) < 56) {
              openDialogue(r.teacher.name, r.teacher.dialog);
              if (r.type === 'classroom') completeMission('classroom');
              if (['science_lab', 'computer_lab', 'robotics_lab'].includes(r.type)) completeMission('laboratory');

                showBanner('🥪 ¡REFRIGERIO SALUDABLE!', 'Pan con pollo + Chicha morada (+100% Energía)', '#617B56', 2.4);

              return;
            }
          }

          if (r.students) {
            for (const st of r.students) {
              if (Math.hypot(player.wx - st.wx, player.wy - st.wy) < 38) {
                openDialogue(st.name, st.dialog);
                return;
              }
            }
          }

          if (player.wx >= 85 && player.wx <= 195 && player.wy <= 44) {
            openDialogue(r.boardTitle, r.boardLines);
            return;
          }

          if (r.type === 'principal_office' && player.wy <= 55 && (player.wx <= 70 || player.wx >= 200)) {
            openDialogue('Vitrina de Trofeos Institucionales', [
              '🏆 Gallardete de Honor — Desfile Escolar Fiestas Patrias.',
              '🥇 Primer Puesto Nacional — Feria Escolar de Ciencia y Tecnología EUREKA.'
            ]);
            return;
          }
        }
      }

      function kickSoccerBall(power = 155) {
        const dx = soccerBall.wx - player.wx;
        const dy = soccerBall.wy - player.wy;
        const dist = Math.hypot(dx, dy) || 1;
        soccerBall.vx = (dx / dist) * power;
        soccerBall.vy = (dy / dist) * power;
        SFX.kick();
      }

      // ======================================================================
      // 9. ACTUALIZACIÓN DE FÍSICA Y TRANSICIONES (60 FPS)
      // ======================================================================
      function update(dt) {
        gameState.animTime += dt;

        if (gameState.screen === 'STORY' && gameState.storyPhase === 'COMIC') {
          gameState.storyElapsed += dt;
          if (gameState.storyElapsed >= 18) gameState.storyPhase = 'BRIEFING';
        }

        if (gameState.portalCooldown > 0) {
          gameState.portalCooldown = Math.max(0, gameState.portalCooldown - dt);
        }

        if (gameState.banner.timer > 0) {
          gameState.banner.timer = Math.max(0, gameState.banner.timer - dt);
        }

        if (gameState.fadeMode === 'out') {
          gameState.fadeAlpha = Math.min(1, gameState.fadeAlpha + dt * 5.8);
          if (gameState.fadeAlpha >= 1) {
            if (gameState.pendingTransition) {
              const fn = gameState.pendingTransition;
              gameState.pendingTransition = null;
              fn();
            }
            gameState.fadeMode = 'in';
          }
          return;
        } else if (gameState.fadeMode === 'in') {
          gameState.fadeAlpha = Math.max(0, gameState.fadeAlpha - dt * 5.8);
          if (gameState.fadeAlpha <= 0) {
            gameState.fadeMode = 'none';
          }
        }

        if (gameState.screen !== 'GAME') return;

        gameState.missionTimeLeft = Math.max(0, gameState.missionTimeLeft - dt);
        if (gameState.missionTimeLeft <= 0) {
          BGM.stop();
          setScreen('DEFEAT');
          return;
        }

        if (gameState.dialogue.active) {
          const d = gameState.dialogue;
          const line = d.lines[d.lineIndex];
          if (d.charIndex < line.length) {
            d.charTimer += dt;
            if (d.charTimer >= 0.02) {
              d.charTimer = 0;
              d.charIndex++;
            }
          }
          player.moving = false;
          return;
        }

        let sx = 0;
        let sy = 0;
        if (keys.up) sy -= 1;
        if (keys.down) sy += 1;
        if (keys.left) sx -= 1;
        if (keys.right) sx += 1;

        if (sx !== 0 || sy !== 0) {
          const len = Math.hypot(sx, sy);
          sx /= len;
          sy /= len;

          const isoDelta = isoToWorldDelta(sx, sy);
          const wLen = Math.hypot(isoDelta.dwx, isoDelta.dwy) || 1;
          const vx = (isoDelta.dwx / wLen) * player.speed;
          const vy = (isoDelta.dwy / wLen) * player.speed;

          if (Math.abs(vx) > Math.abs(vy)) {
            player.dir = vx > 0 ? 'SE' : 'NW';
          } else {
            player.dir = vy > 0 ? 'SW' : 'NE';
          }

          player.moving = true;
          player.walkTimer += dt;
          if (player.walkTimer >= 0.16) {
            player.walkTimer = 0;
            player.walkFrame = (player.walkFrame + 1) % 2;
          }

          const colliders = getWorldColliders();
          const currentOverlaps = colliders.filter(c => boxesOverlap(getPlayerBox(player.wx, player.wy), c));

          const nextWx = player.wx + vx * dt;
          const nextBoxX = getPlayerBox(nextWx, player.wy);
          if (!colliders.some(c => !currentOverlaps.includes(c) && boxesOverlap(nextBoxX, c))) {
            player.wx = nextWx;
          }

          const nextWy = player.wy + vy * dt;
          const nextBoxY = getPlayerBox(player.wx, nextWy);
          if (!colliders.some(c => !currentOverlaps.includes(c) && boxesOverlap(nextBoxY, c))) {
            player.wy = nextWy;
          }
        } else {
          player.moving = false;
          player.walkFrame = 0;
        }

        // Física de la pelota en la Cancha Verde (#617B56)
        if (gameState.scene === 'CAMPUS') {
          if (soccerBall.goalCooldown > 0) soccerBall.goalCooldown -= dt;

          if (Math.hypot(player.wx - soccerBall.wx, player.wy - soccerBall.wy) < 14) {
            kickSoccerBall(155);
          }

          if (Math.hypot(soccerBall.vx, soccerBall.vy) > 1.5) {
            soccerBall.wx += soccerBall.vx * dt;
            soccerBall.wy += soccerBall.vy * dt;
            soccerBall.spin += Math.hypot(soccerBall.vx, soccerBall.vy) * dt * 0.15;
            soccerBall.vx *= Math.pow(0.22, dt);
            soccerBall.vy *= Math.pow(0.22, dt);

            if (soccerBall.wx < 262) {
              const inGoal = soccerBall.wy >= 148 && soccerBall.wy <= 180;
              if (inGoal && soccerBall.goalCooldown <= 0) {
                soccerBall.goalCooldown = 2.0;
                SFX.goal();
                showBanner('⚽ ¡GOOOOL ESCOLAR!', '¡Gran anotación en la cancha verde!', '#D9B656', 2.4);
                completeMission('goal');
                soccerBall.wx = 340;
                soccerBall.wy = 164;
                soccerBall.vx = 0;
                soccerBall.vy = 0;
              } else {
                soccerBall.wx = 262;
                soccerBall.vx = Math.abs(soccerBall.vx) * 0.75;
              }
            } else if (soccerBall.wx > 418) {
              const inGoal = soccerBall.wy >= 148 && soccerBall.wy <= 180;
              if (inGoal && soccerBall.goalCooldown <= 0) {
                soccerBall.goalCooldown = 2.0;
                SFX.goal();
                showBanner('⚽ ¡GOOOOL ESCOLAR!', '¡Golazo en la losa deportiva!', '#D9B656', 2.4);
                completeMission('goal');
                soccerBall.wx = 340;
                soccerBall.wy = 164;
                soccerBall.vx = 0;
                soccerBall.vy = 0;
              } else {
                soccerBall.wx = 418;
                soccerBall.vx = -Math.abs(soccerBall.vx) * 0.75;
              }
            }

            if (soccerBall.wy < 118) {
              soccerBall.wy = 118;
              soccerBall.vy = Math.abs(soccerBall.vy) * 0.75;
            } else if (soccerBall.wy > 210) {
              soccerBall.wy = 210;
              soccerBall.vy = -Math.abs(soccerBall.vy) * 0.75;
            }
          }
        }

        // Activación automática de tapetes y escaleras al pisarlos
        if (gameState.portalCooldown <= 0 && gameState.fadeMode === 'none') {
          const pBox = getPlayerBox(player.wx, player.wy);

          if (gameState.scene === 'CAMPUS') {
            for (const b of CAMPUS_BUILDINGS) {
              const matBox = { wx: b.doorWx, wy: b.doorWy, w: 20, d: 14 };
              if (boxesOverlap(pBox, matBox)) {
                if (b.id === 'kiosco') enterDirectRoom(DIRECT_ROOMS.kiosco);
                else if (b.id === 'sshh') enterDirectRoom(DIRECT_ROOMS.sshh);
                else enterBuildingHallway(b.id, 1);
                return;
              }
            }
          } else if (gameState.scene === 'HALLWAY') {
            const b = BUILDINGS[gameState.currentBuildingId];
            const floorInfo = b.floors[gameState.currentFloor];

            // Salida al patio SOLO si el personaje está en el 1° piso
            if (gameState.currentFloor === 1 && boxesOverlap(pBox, { wx: 138, wy: 170, w: 44, d: 14 })) {
              returnToCampus();
              return;
            }

            // Escaleras isométricas multi-piso
            if (b.hasStairs && boxesOverlap(pBox, { wx: 6, wy: 72, w: 36, d: 56 })) {
              useStairs(gameState.currentFloor === 1 ? 2 : 1);
              return;
            }

            const doors = getHallwayDoors(floorInfo.rooms);
            for (const d of doors) {
              if (boxesOverlap(pBox, d)) {
                enterSpecificRoom(d.room, d.wx + d.w / 2);
                return;
              }
            }
          } else if (gameState.scene === 'ROOM') {
            if (boxesOverlap(pBox, { wx: 112, wy: 200, w: 46, d: 14 })) {
              if (gameState.currentBuildingId) {
                enterBuildingHallway(gameState.currentBuildingId, gameState.currentFloor, gameState.lastHallwayReturnPos);
              } else {
                returnToCampus(gameState.lastDirectExitPos);
              }
              return;
            }
          }
        }
      }

          wrapCanvasText('Lucho, con todo su poder, completó las misiones e hizo que el cometa se desviara.', 480, 184, 710, 19);

          const t = (gameState.animTime % 6) / 6;
          const earthX = 690;

          drawComicEarth(earthX, earthY, 76);
          drawComicLucho(250, 454, 2.7);
          ctx.strokeStyle = 'rgba(217, 182, 86, 0.7)';
          ctx.lineWidth = 2;
          ctx.setLineDash([7, 7]);
          ctx.beginPath(); ctx.moveTo(390, 245); ctx.lineTo(earthX - 85, earthY - 10); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(earthX - 85, earthY - 10); ctx.lineTo(400, 225); ctx.stroke();
          ctx.setLineDash([]);

          let cometX;
          let cometY;
          let trailAngle;
          if (t < 0.48) {
            const approach = t / 0.48;
            cometX = 390 + approach * 205;
            cometY = 245 + approach * 75;
            trailAngle = -0.62;
          } else {
            const deflect = (t - 0.48) / 0.52;
            cometX = 595 - deflect * 245;
            cometY = 320 - deflect * 140;
            trailAngle = 2.2;
            ctx.strokeStyle = `rgba(217, 182, 86, ${0.35 + Math.sin(gameState.animTime * 12) * 0.2})`;
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(300, 378); ctx.lineTo(cometX, cometY); ctx.stroke();
            ctx.fillStyle = 'rgba(217, 182, 86, 0.35)';
            ctx.beginPath(); ctx.arc(595, 320, 45 + Math.sin(gameState.animTime * 9) * 8, 0, Math.PI * 2); ctx.fill();
          }
          drawComicMeteor(cometX, cometY, 0.82, trailAngle);
          ctx.fillStyle = '#617B56'; ctx.fillRect(438, 420, 340, 37);
          ctx.fillStyle = '#DEDBD0'; ctx.font = 'bold 16px "Courier New", monospace';

          ctx.fillStyle = '#A65A4E';
          ctx.font = 'bold 30px "Courier New", monospace';
          ctx.fillText('¡EL METEORITO IMPACTÓ!', 480, 150);
          ctx.fillStyle = '#DEDBD0';
          ctx.font = 'bold 14px "Courier New", monospace';
          ctx.fillText('Lucho no completó todas las misiones antes de que se acabara el tiempo.', 480, 188);

          const impact = Math.max(0, (t - 0.28) / 0.72);

          drawComicEarth(earthX, earthY, 78, impact > 0.35);
          if (t < 0.36) {
            drawComicMeteor(360 + (t / 0.36) * 120, 222 + (t / 0.36) * 72, 0.86, -0.62);
          }
          if (impact > 0.15) {

            ctx.strokeStyle = `rgba(240, 166, 76, ${Math.max(0.15, 1 - impact * 0.65)})`;
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.arc(earthX, earthY, radius, 0, Math.PI * 2); ctx.stroke();
            for (let i = 0; i < 12; i++) {

      function renderCampusIso() {
        const ox = 480;
        const oy = 96;

        ctx.fillStyle = '#263635';
        ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

        // Plataforma base del colegio (440 x 440)
        drawIsoBox(0, 0, 440, 440, -16, 16, {
          top: '#C7BCA1',
          left: '#8A7F6A',
          right: '#3A2F26',
          outline: '#3A2F26'
        }, ox, oy);

        // Juntas de dilatación del cemento
        ctx.strokeStyle = 'rgba(138, 127, 106, 0.55)';
        ctx.lineWidth = 1;
        for (let g = 40; g < 440; g += 40) {
          const p0 = worldToIso(g, 0, 0, ox, oy);
          const p1 = worldToIso(g, 440, 0, ox, oy);
          ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();

          const q0 = worldToIso(0, g, 0, ox, oy);
          const q1 = worldToIso(440, g, 0, ox, oy);
          ctx.beginPath(); ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.stroke();
        }

        // Patio Principal de Cemento
        const patioPts = [
          worldToIso(18, 96, 0.2, ox, oy),
          worldToIso(236, 96, 0.2, ox, oy),
          worldToIso(236, 330, 0.2, ox, oy),
          worldToIso(18, 330, 0.2, ox, oy)
        ];
        drawIsoPoly(patioPts, '#DEDBD0', '#8A7F6A', 1.5);

        // Líneas de formación escolar
        ctx.strokeStyle = '#8A7F6A';
        ctx.lineWidth = 2;
        for (let col = 0; col < 5; col++) {

      function drawIsoFutsalLines(wx, wy, w, d, ox, oy) {

        ctx.beginPath(); ctx.moveTo(m0.x, m0.y); ctx.lineTo(m1.x, m1.y); ctx.stroke();

        const c = worldToIso(wx + w / 2, wy + d / 2, 0.5, ox, oy);
        ctx.beginPath(); ctx.ellipse(c.x, c.y, 16, 8, 0, 0, Math.PI * 2); ctx.stroke();
      }
