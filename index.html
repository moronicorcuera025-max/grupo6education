      // ======================================================================
      // OVERLAYS: BANNERS, CUADRO DE DIÁLOGO RPG Y FADE
      // ======================================================================
      function renderOverlays() {
        if (gameState.screen === 'GAME') {
          const done = gameState.completedMissions.length;
          const seconds = Math.ceil(gameState.missionTimeLeft);
          const clock = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
          const nextMission = MISSION_DEFS.find(item => !gameState.completedMissions.includes(item.id));
          ctx.fillStyle = 'rgba(38, 54, 53, 0.94)';
          ctx.fillRect(12, 12, 286, 66);
          ctx.strokeStyle = '#D9B656';
          ctx.lineWidth = 2;
          ctx.strokeRect(12, 12, 286, 66);
          ctx.textAlign = 'left';
          ctx.fillStyle = '#D9B656';
          ctx.font = 'bold 12px "Courier New", monospace';
          ctx.fillText(`MISIONES ${done}/${MISSION_DEFS.length}   ⏱ ${clock}`, 22, 31);
          ctx.fillStyle = '#DEDBD0';
          ctx.font = 'bold 9px "Courier New", monospace';
          ctx.fillText(gameState.hasSpatula ? 'ESPÁTULA: ENCONTRADA' : 'ESPÁTULA: BUSCA EN EL PATIO', 22, 47, 264);
          ctx.fillText(nextMission ? nextMission.text : '¡Todas completadas!', 22, 65, 264);

          const fAction = getNearbyFInteraction();
          if (fAction) {
            ctx.fillStyle = 'rgba(38, 54, 53, 0.96)';
            ctx.fillRect(320, 566, 320, 42);
            ctx.strokeStyle = '#D9B656'; ctx.lineWidth = 2;
            ctx.strokeRect(320, 566, 320, 42);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#D9B656'; ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillText(`[F] ${fAction.text.toUpperCase()}`, 480, 592);
          }
        }

        if (gameState.screen === 'GAME' && gameState.banner.timer > 0) {
          const alpha = Math.min(1, gameState.banner.timer * 2);
          ctx.save();
          ctx.globalAlpha = alpha;
          const bw = 440;
          const bh = 54;
          const bx = (LOGICAL_W - bw) / 2;
          const by = 16;

          ctx.fillStyle = 'rgba(38, 54, 53, 0.96)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = gameState.banner.color;
          ctx.lineWidth = 3;
          ctx.strokeRect(bx, by, bw, bh);

          ctx.fillStyle = gameState.banner.color;
          ctx.font = 'bold 17px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(gameState.banner.text, LOGICAL_W / 2, by + 23);

          if (gameState.banner.subtext) {
            ctx.fillStyle = '#DEDBD0';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.fillText(gameState.banner.subtext, LOGICAL_W / 2, by + 41);
          }
          ctx.restore();
        }

        if (gameState.screen === 'GAME' && gameState.dialogue.active) {
          const d = gameState.dialogue;
          const boxW = 840;
          const boxH = 114;
          const bx = (LOGICAL_W - boxW) / 2;
          const by = LOGICAL_H - boxH - 18;

          ctx.fillStyle = 'rgba(38, 54, 53, 0.97)';
          ctx.fillRect(bx, by, boxW, boxH);
          ctx.strokeStyle = '#D9B656';
          ctx.lineWidth = 3;
          ctx.strokeRect(bx, by, boxW, boxH);
          ctx.strokeStyle = '#8A7F6A';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx + 5, by + 5, boxW - 10, boxH - 10);

          ctx.fillStyle = '#D9B656';
          ctx.font = 'bold 14px "Courier New", monospace';
          ctx.textAlign = 'left';
          ctx.fillText(`▶ ${d.speaker}`, bx + 20, by + 26);

          const fullText = d.lines[d.lineIndex].slice(0, d.charIndex);
          ctx.fillStyle = '#DEDBD0';
          ctx.font = 'bold 14px "Courier New", monospace';
          wrapCanvasText(fullText, bx + 20, by + 50, boxW - 40, 20);

          if (Math.sin(gameState.animTime * 8) > 0) {
            ctx.fillStyle = '#C7BCA1';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText('[E / ESPACIO] Continuar ▼', bx + boxW - 20, by + boxH - 14);
          }
        }

        if (gameState.fadeAlpha > 0) {
          ctx.fillStyle = `rgba(38, 54, 53, ${gameState.fadeAlpha})`;
          ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
        }
      }

      function wrapCanvasText(text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (ctx.measureText(testLine).width > maxWidth && n > 0) {
            ctx.fillText(line, x, curY);
            line = words[n] + ' ';
            curY += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, curY);
      }

      function render() {
        ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
        if (gameState.screen === 'MENU') {
          renderMenuScreen();
        } else if (gameState.screen === 'CHAR_SELECT') {
          renderCharSelectScreen();
        } else if (gameState.screen === 'STORY') {
          renderStoryScreen();
        } else if (gameState.screen === 'VICTORY') {
          renderEndScreen(true);
        } else if (gameState.screen === 'DEFEAT') {
          renderEndScreen(false);
        } else {
          if (gameState.scene === 'CAMPUS') renderCampusIso();
          else if (gameState.scene === 'HALLWAY') renderHallwayIso();
          else if (gameState.scene === 'ROOM') renderRoomIso();
        }
        renderOverlays();
      }

      // ======================================================================
      // 14. EVENTOS DE MOUSE, TÁCTIL Y TECLADO
      // ======================================================================
      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((clientX - rect.left) / rect.width) * LOGICAL_W,
          y: ((clientY - rect.top) / rect.height) * LOGICAL_H
        };
      }

      function pointInBox(pt, box) {
        return pt.x >= box.x && pt.x <= box.x + box.w && pt.y >= box.y && pt.y <= box.y + box.h;
      }

      canvas.addEventListener('pointerdown', (e) => {
        ensureAudio();
        const pt = getCanvasCoords(e.clientX, e.clientY);

        if (gameState.screen === 'MENU') {
          if (pointInBox(pt, UI_HITBOXES.menuPlay)) {
            gameState.menuFocus = 0;
            startGameFromMenu();
          } else if (pointInBox(pt, UI_HITBOXES.menuSelectChar)) {
            gameState.menuFocus = 1;
            SFX.uiSelect();
            gameState.selectFocus = gameState.selectedChar === 'girl' ? 1 : 0;
            setScreen('CHAR_SELECT');
          }
        } else if (gameState.screen === 'CHAR_SELECT') {
          if (pointInBox(pt, UI_HITBOXES.charCardBoy)) {
            gameState.selectedChar = 'boy';
            gameState.selectFocus = 0;
            SFX.uiSelect();
          } else if (pointInBox(pt, UI_HITBOXES.charCardGirl)) {
            gameState.selectedChar = 'girl';
            gameState.selectFocus = 1;
            SFX.uiSelect();
          } else if (pointInBox(pt, UI_HITBOXES.charConfirm)) {
            gameState.selectFocus = 2;
            SFX.uiConfirm();
            setScreen('MENU');
          }
        } else if (gameState.screen === 'STORY') {
          if (gameState.storyPhase === 'COMIC') advanceComic();
          else if (pointInBox(pt, UI_HITBOXES.storyStart)) beginAdventure();
        } else if (gameState.screen === 'VICTORY' || gameState.screen === 'DEFEAT') {
          if (pointInBox(pt, UI_HITBOXES.endHome)) {
            BGM.stop();
            setScreen('MENU');
          }
        } else if (gameState.screen === 'GAME' && gameState.dialogue.active) {
          advanceDialogue();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        const pt = getCanvasCoords(e.clientX, e.clientY);
        let overButton = false;

        if (gameState.screen === 'MENU') {
          if (pointInBox(pt, UI_HITBOXES.menuPlay)) {
            gameState.menuFocus = 0;
            overButton = true;
          } else if (pointInBox(pt, UI_HITBOXES.menuSelectChar)) {
            gameState.menuFocus = 1;
            overButton = true;
          }
        } else if (gameState.screen === 'CHAR_SELECT') {
          if (pointInBox(pt, UI_HITBOXES.charCardBoy) || pointInBox(pt, UI_HITBOXES.charCardGirl) || pointInBox(pt, UI_HITBOXES.charConfirm)) {
            overButton = true;
          }
        } else if (gameState.screen === 'STORY') {
          overButton = gameState.storyPhase === 'COMIC' || pointInBox(pt, UI_HITBOXES.storyStart);
        } else if (gameState.screen === 'VICTORY' || gameState.screen === 'DEFEAT') {
          overButton = pointInBox(pt, UI_HITBOXES.endHome);
        }
        canvas.style.cursor = overButton ? 'pointer' : 'default';
      });

      window.addEventListener('keydown', (e) => {
        const code = e.code;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
          e.preventDefault();
        }
        ensureAudio();

        if (gameState.screen === 'MENU') {
          if (code === 'ArrowUp' || code === 'KeyW' || code === 'ArrowDown' || code === 'KeyS') {
            gameState.menuFocus = gameState.menuFocus === 0 ? 1 : 0;
            SFX.uiSelect();
          } else if (code === 'Enter' || code === 'Space' || code === 'KeyE') {
            handleInteractPressed();
          }
          return;
        }

        if (gameState.screen === 'CHAR_SELECT') {
          if (code === 'ArrowLeft' || code === 'KeyA') {
            gameState.selectedChar = 'boy';
            gameState.selectFocus = 0;
            SFX.uiSelect();
          } else if (code === 'ArrowRight' || code === 'KeyD') {
            gameState.selectedChar = 'girl';
            gameState.selectFocus = 1;
            SFX.uiSelect();
          } else if (code === 'ArrowDown' || code === 'KeyS') {
            gameState.selectFocus = 2;
            SFX.uiSelect();
          } else if (code === 'ArrowUp' || code === 'KeyW') {
            gameState.selectFocus = gameState.selectedChar === 'girl' ? 1 : 0;
            SFX.uiSelect();
          } else if (code === 'Enter' || code === 'Space' || code === 'KeyE') {
            SFX.uiConfirm();
            setScreen('MENU');
          } else if (code === 'Escape') {
            SFX.uiSelect();
            setScreen('MENU');
          }
          return;
        }

        if (gameState.screen === 'STORY') {
          if (code === 'Escape') {
            if (gameState.storyPhase === 'COMIC') gameState.storyPhase = 'BRIEFING';
            else {
              BGM.stop();
              setScreen('MENU');
            }
          } else if (code === 'Enter' || code === 'Space' || code === 'KeyE') {
            if (gameState.storyPhase === 'COMIC') advanceComic();
            else beginAdventure();
          }
          return;
        }

        if (gameState.screen === 'VICTORY' || gameState.screen === 'DEFEAT') {
          if (code === 'Enter' || code === 'Space' || code === 'KeyE' || code === 'Escape') {
            BGM.stop();
            setScreen('MENU');
          }
          return;
        }

        if (code === 'ArrowUp' || code === 'KeyW') keys.up = true;
        if (code === 'ArrowDown' || code === 'KeyS') keys.down = true;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = true;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = true;

        if (code === 'KeyE' || code === 'Space' || code === 'Enter') {
          handleInteractPressed();
        }
        if (code === 'KeyR') {
          attemptWallRepair();
        }
        if (code === 'KeyF') {
          interactWithFObject();
        }
        if (code === 'Escape' && gameState.dialogue.active) {
          gameState.dialogue.active = false;
        }
      });

      window.addEventListener('keyup', (e) => {
        const code = e.code;
        if (code === 'ArrowUp' || code === 'KeyW') keys.up = false;
        if (code === 'ArrowDown' || code === 'KeyS') keys.down = false;
        if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
        if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
      });

      document.querySelectorAll('.pad-btn').forEach(btn => {
        const dir = btn.dataset.dir;
        const press = (e) => {
          e.preventDefault();
          ensureAudio();
          keys[dir] = true;
          btn.classList.add('is-pressed');
        };
        const release = (e) => {
          e.preventDefault();
          keys[dir] = false;
          btn.classList.remove('is-pressed');
        };
        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release);
        btn.addEventListener('pointercancel', release);
      });

      document.getElementById('btnTouchInteract').addEventListener('click', () => {
        handleInteractPressed();
      });

      document.getElementById('btnTouchItem').addEventListener('click', () => {
        interactWithFObject();
      });

      // ======================================================================
      // 15. BUCLE PRINCIPAL DE 60 FPS (INICIO EN WINDOW.ONLOAD)
      // ======================================================================
      let lastTimestamp = 0;
      function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;

        update(dt);
        render();
        requestAnimationFrame(gameLoop);
      }

      window.onload = function () {
        setScreen('MENU');
        resizeCanvas();
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
</body>
</html>
